name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, dom
      - run: find . -name '*.php' -not -path './.git/*' -exec php -l {} \;
      - run: php tests/run.php
      - run: php tests/render.php
      - run: php tests/reporting.php
      - run: php tests/isolation.php
      - run: php tests/routing.php
      - run: php tests/run.php --temporary-webhook
      - run: node --check assets/donation-box.js
      - run: node tests/frontend.js
      - run: python3 scripts/build_translations.py
      - run: python3 scripts/build.py
